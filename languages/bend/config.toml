name = "Bend"
grammar = "bend"
path_suffixes = ["bend"]
line_comments = ["# "]
tab_size = 2
hard_tabs = false
brackets = [
  { start = "{", end = "}", close = true, newline = true, not_in = ["string", "comment"] },
  { start = "[", end = "]", close = true, newline = true, not_in = ["string", "comment"] },
  { start = "(", end = ")", close = true, newline = true, not_in = ["string", "comment"] },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
increase_indent_pattern = ":\\s*$"
code_fence_block_name = "bend"

[overrides.string]
completion_query_characters = ["-"]

[overrides.comment]
completion_query_characters = []
